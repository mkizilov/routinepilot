ktor {
    deployment {
        port = 8080
        port = ${?RP_PORT}
        sslPort = ${?RP_SSL_PORT}
    }

    application {
        modules = [ com.routinepilot.backend.ApplicationKt.module ]
    }

    security {
        ssl {
            keyStore = ${?RP_KEYSTORE_PATH}
            keyAlias = ${?RP_KEY_ALIAS}
            keyStorePassword = ${?RP_KEYSTORE_PASSWORD}
            privateKeyPassword = ${?RP_KEY_PASSWORD}
        }
    }
}

rp {
    database {
        url = "jdbc:postgresql://localhost:5432/routinepilot"
        url = ${?RP_DATABASE_URL}
        user = "routinepilot"
        user = ${?RP_DATABASE_USER}
        // No default password: the service fails to connect until RP_DATABASE_PASSWORD is set.
        password = ""
        password = ${?RP_DATABASE_PASSWORD}
        maxPoolSize = 10
        maxPoolSize = ${?RP_DATABASE_MAX_POOL}
    }

    auth {
        sessionDays = 30
        sessionDays = ${?RP_SESSION_DAYS}
        passwordIterations = 600000
        passwordIterations = ${?RP_PASSWORD_ITERATIONS}
    }

    security {
        requireHttps = false
        requireHttps = ${?RP_REQUIRE_HTTPS}
        // Set only when a reverse proxy you control sets X-Forwarded-Proto and X-Forwarded-For.
        trustForwardedHeaders = false
        trustForwardedHeaders = ${?RP_TRUST_FORWARDED_HEADERS}
    }

    rateLimit {
        authPerIp {
            limit = 30
            windowSeconds = 60
        }
        loginPerAccount {
            limit = 10
            windowSeconds = 900
        }
        apiPerSession {
            limit = 600
            windowSeconds = 60
        }
    }

    sync {
        maxBatchChanges = 200
        maxPayloadBytes = 16384
        maxBodyBytes = 1048576
        pageSize = 500
    }
}
