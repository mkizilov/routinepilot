name: Release build

# Builds the release bundle. Signing and the sync address come from repository secrets and variables, and nothing is
# committed. Without the secrets the bundle is built unsigned, and sync is turned off unless a sync URL is set.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unit tests must pass before a bundle is built
        run: gradle testDebugUnitTest --no-daemon
      - name: Decode the signing keystore, when one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.RP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build the release bundle
        env:
          RP_KEYSTORE_PASSWORD: ${{ secrets.RP_KEYSTORE_PASSWORD }}
          RP_KEY_ALIAS: ${{ secrets.RP_KEY_ALIAS }}
          RP_KEY_PASSWORD: ${{ secrets.RP_KEY_PASSWORD }}
          ROUTINEPILOT_SYNC_URL: ${{ vars.ROUTINEPILOT_SYNC_URL }}
        run: gradle bundleRelease --no-daemon
      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: routinepilot-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
